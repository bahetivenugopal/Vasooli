[project]
name = "vasooli-api"
version = "0.1.0"
description = "Vasooli — AI-first revenue recovery engine (API)"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]
exclude = [
    ".venv",
    "__pycache__",
    ".ruff_cache",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort — import ordering
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line length — the formatter owns this
    "B008",   # function call in default arg — this is the FastAPI Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]        # re-exports are intentional
"app/tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
addopts = "-q"
# Pin the scope explicitly — pytest-asyncio warns on every run while it is unset,
# and its future default (function) differs from today's (fixture caching scope).
asyncio_default_fixture_loop_scope = "function"
